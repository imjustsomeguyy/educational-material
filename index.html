<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barcode Generator</title>

  <!-- Barcode generator -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <!-- Camera barcode scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #1a1f1c;
      --card: #222827;
      --text: #dfeee0;
      --text-sub: #6b7c6e;
      --accent: #68b06a;
      --accent-hover: #4f9a52;
      --btn-bg: #2a2f2d;
      --btn-border: #555;
      --barcode-bg: #e6efe7;
      --barcode-text: #1f2b21;
      --danger: #e0576a;
      --danger-hover: #c8384c;
    }

    .light-mode {
      --bg: #f4f7f5;
      --card: #ffffff;
      --text: #1f2b21;
      --text-sub: #5a6a5c;
      --accent: #4f9a52;
      --accent-hover: #3e7e41;
      --btn-bg: #e8efe9;
      --btn-border: #ccc;
      --barcode-bg: #ffffff;
      --barcode-text: #1f2b21;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem 1rem 3rem;
      transition: background-color 0.3s, color 0.3s;
    }

    h1 {
      text-align: center;
      font-size: 1.3rem;
      margin: 0 0 0.2rem;
    }

    .subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin: 0 0 1.5rem;
    }

    .top-controls {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .toggle-mode-btn {
      background: var(--btn-bg);
      color: var(--text);
      border: 1px solid var(--btn-border);
      padding: 0.4rem 0.8rem;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .container {
      background: var(--card);
      color: var(--text);
      padding: 1.5rem;
      border-radius: 1rem;
      max-width: 450px;
      margin: 0 auto 1.5rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--text-sub);
      margin-bottom: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .preset-row {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.9rem;
    }

    .preset-btn {
      flex: 1;
      background: var(--btn-bg);
      color: var(--text);
      border: 1px solid var(--btn-border);
      padding: 0.5rem;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 0.4rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .preset-btn.active {
      border-color: var(--accent);
      background: rgba(104, 176, 106, 0.15);
    }

    #custom-inputs-group {
      display: block;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 0.65rem 0.7rem;
      margin: 0 0 0.9rem;
      font-size: 0.9rem;
      border-radius: 0.5rem;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text);
      outline: none;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: var(--accent);
    }

    input[type="text"]::placeholder {
      color: var(--text-sub);
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    .input-row input[type="text"] {
      flex: 1;
    }

    .scan-btn {
      flex-shrink: 0;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.9rem;
    }

    .scan-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .add-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.02);
    }

    .error-msg {
      font-size: 0.75rem;
      color: var(--danger);
      margin: -0.5rem 0 0.8rem;
      display: none;
    }

    .section-label {
      text-align: center;
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 1.5rem 0 0.8rem;
    }

    .empty-state {
      max-width: 450px;
      margin: 0 auto;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-sub);
      border: 1px dashed var(--btn-border);
      border-radius: 1rem;
      padding: 2rem 1rem;
    }

    .barcode-list {
      max-width: 450px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .barcode-tab-card {
      background: var(--card);
      border: 1px solid var(--btn-border);
      border-radius: 1rem;
      padding: 1.2rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .barcode-name {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text);
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .barcode-frame {
      background: var(--barcode-bg);
      padding: 1rem;
      border-radius: 0.8rem;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .barcode-frame svg {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .barcode-card-footer {
      display: flex;
      justify-content: center;
      margin-top: 0.8rem;
    }

    .delete-btn {
      background: var(--btn-bg);
      color: var(--danger);
      border: 1px solid var(--btn-border);
      border-radius: 0.5rem;
      padding: 0.4rem 0.9rem;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #3a2226;
      border-color: var(--danger-hover);
    }

    .watermark {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-sub);
      margin-top: 2rem;
    }

    /* Scanner */

    .scanner-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .scanner-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .scanner-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -48%) scale(0.94);
      z-index: 101;
      background: var(--card);
      border-radius: 1rem;
      padding: 1.2rem;
      width: min(380px, 92vw);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .scanner-modal.open {
      opacity: 1;
      pointer-events: all;
      transform: translate(-50%, -50%) scale(1);
    }

    .scanner-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.8rem;
    }

    .scanner-title {
      font-size: 0.9rem;
      font-weight: bold;
    }

    .scanner-close {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
    }

    #scanner-viewport {
      width: 100%;
      border-radius: 0.7rem;
      overflow: hidden;
      background: #000;
      min-height: 220px;
    }

    .scanner-status {
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-top: 0.7rem;
      text-align: center;
      min-height: 1.2em;
    }

    .scanner-status.success {
      color: var(--accent);
      font-weight: bold;
    }

    .scanner-status.error {
      color: var(--danger);
    }
  </style>
</head>

<body>

  <div class="top-controls">
    <button class="toggle-mode-btn" id="toggle-mode-btn">
      Toggle Dark Mode
    </button>
  </div>

  <h1>Barcode Generator</h1>
  <p class="subtitle">Create barcodes and keep them logged below</p>

  <div class="container">

    <label>System Presets</label>

    <div class="preset-row">
      <button class="preset-btn" data-value="10p">10p</button>
      <button class="preset-btn" data-value="49p">49p</button>
      <button class="preset-btn" data-value="1">£1</button>
      <button class="preset-btn active" data-value="custom">Custom</button>
    </div>

    <div id="custom-inputs-group">

      <label for="barcode-name">Name (optional)</label>
      <input
        type="text"
        id="barcode-name"
        placeholder="e.g. Warehouse Bin 4"
        autocomplete="off"
      />

      <label for="barcode-value">Data</label>

      <div class="input-row">

        <input
          type="text"
          id="barcode-value"
          placeholder="Enter text or number..."
          autocomplete="off"
        />

        <button
          class="scan-btn"
          id="scan-open-btn"
          title="Scan a barcode with your camera"
        >
          📷
        </button>

      </div>

      <label for="barcode-format">Format</label>

      <select id="barcode-format">
        <option value="CODE128">CODE128</option>
        <option value="EAN13">EAN-13</option>
      </select>

    </div>

    <p class="error-msg" id="error-msg"></p>

    <button class="add-btn" id="add-btn">
      Generate Barcode
    </button>

  </div>


  <!-- Scanner -->

  <div class="scanner-overlay" id="scanner-overlay"></div>

  <div class="scanner-modal" id="scanner-modal">

    <div class="scanner-header">
      <div class="scanner-title">Scan Barcode</div>

      <button class="scanner-close" id="scanner-close-btn">
        &times;
      </button>
    </div>

    <div id="scanner-viewport"></div>

    <div class="scanner-status" id="scanner-status">
      Point your camera at a barcode...
    </div>

  </div>


  <!-- Saved Barcodes -->

  <p class="section-label">Saved Barcodes</p>

  <div class="empty-state" id="em-state">
    No barcodes saved yet.
  </div>

  <div class="barcode-list" id="barcode-container"></div>

  <div class="watermark">
    monkeymansilly1.github.io
  </div>


  <script>

    const barcodeNameInput =
      document.getElementById("barcode-name");

    const barcodeValueInput =
      document.getElementById("barcode-value");

    const barcodeFormatSelect =
      document.getElementById("barcode-format");

    const addBtn =
      document.getElementById("add-btn");

    const errorMsg =
      document.getElementById("error-msg");

    const emptyState =
      document.getElementById("em-state");

    const barcodeContainer =
      document.getElementById("barcode-container");

    const toggleModeBtn =
      document.getElementById("toggle-mode-btn");

    const customInputsGroup =
      document.getElementById("custom-inputs-group");

    const presetButtons =
      document.querySelectorAll(".preset-btn");

    const scanOpenBtn =
      document.getElementById("scan-open-btn");

    const scannerOverlay =
      document.getElementById("scanner-overlay");

    const scannerModal =
      document.getElementById("scanner-modal");

    const scannerCloseBtn =
      document.getElementById("scanner-close-btn");

    const scannerStatus =
      document.getElementById("scanner-status");


    let html5QrcodeScanner = null;
    let savedBarcodes = [];
    let currentPresetMode = "custom";


    const systemPrefixDatabase = {

      "10p": {
        name: "10p Item",
        value: "200010000000",
        format: "EAN13"
      },

      "49p": {
        name: "49p Item",
        value: "200049000000",
        format: "EAN13"
      },

      "1": {
        name: "£1 Item",
        value: "200100000000",
        format: "EAN13"
      }

    };


    /* Theme */

    toggleModeBtn.addEventListener("click", () => {

      document.body.classList.toggle("light-mode");

      toggleModeBtn.textContent =
        document.body.classList.contains("light-mode")
          ? "Toggle Dark Mode"
          : "Toggle Light Mode";

    });


    /* Presets */

    presetButtons.forEach(button => {

      button.addEventListener("click", () => {

        presetButtons.forEach(btn =>
          btn.classList.remove("active")
        );

        button.classList.add("active");

        currentPresetMode =
          button.getAttribute("data-value");

        if (currentPresetMode === "custom") {

          customInputsGroup.style.display = "block";

        } else {

          customInputsGroup.style.display = "none";

        }

        clearValidationError();

      });

    });


    /* Load saved data */

    window.addEventListener("DOMContentLoaded", () => {

      const localData =
        localStorage.getItem("h_barcode_db");

      if (localData) {

        try {

          savedBarcodes =
            JSON.parse(localData);

          renderSavedList();

        } catch (error) {

          console.error(
            "Failed to load saved barcodes:",
            error
          );

          savedBarcodes = [];

        }

      }

    });


    /* EAN-13 checksum */

    function computeEan13CheckDigit(baseString) {

      let sum = 0;

      for (let i = 0; i < 12; i++) {

        const digit =
          parseInt(baseString.charAt(i), 10);

        sum +=
          i % 2 === 0
            ? digit
            : digit * 3;

      }

      const remainder = sum % 10;

      return remainder === 0
        ? 0
        : 10 - remainder;

    }


    /* Validation */

    function validateInput(value, format) {

      if (!value.trim()) {

        return "Data field cannot be empty.";

      }


      if (format === "EAN13") {

        const cleanDigits =
          value.replace(/\D/g, "");

        if (cleanDigits.length < 12) {

          return "EAN-13 requires at least 12 numeric digits.";

        }

        return {
          valid: true,
          cleanValue:
            cleanDigits.substring(0, 12)
        };

      }


      return {
        valid: true,
        cleanValue: value
      };

    }


    function showValidationError(text) {

      errorMsg.textContent = text;
      errorMsg.style.display = "block";

    }


    function clearValidationError() {

      errorMsg.textContent = "";
      errorMsg.style.display = "none";

    }


    /* Generate */

    addBtn.addEventListener("click", () => {

      clearValidationError();

      let labelName = "";
      let rawValue = "";
      let format = "";


      if (currentPresetMode !== "custom") {

        const presetData =
          systemPrefixDatabase[currentPresetMode];

        labelName = presetData.name;
        rawValue = presetData.value;
        format = presetData.format;

      } else {

        labelName =
          barcodeNameInput.value.trim()
          || "Custom Barcode";

        rawValue =
          barcodeValueInput.value;

        format =
          barcodeFormatSelect.value;

      }


      const validation =
        validateInput(rawValue, format);


      if (typeof validation === "string") {

        showValidationError(validation);
        return;

      }


      let finalPayloadValue =
        validation.cleanValue;


      if (format === "EAN13") {

        const checkDigit =
          computeEan13CheckDigit(
            finalPayloadValue
          );

        finalPayloadValue =
          finalPayloadValue + checkDigit;

      }


      const barcodeItem = {

        id:
          "bc_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2, 7),

        name: labelName,
        value: finalPayloadValue,
        format: format

      };


      savedBarcodes.unshift(barcodeItem);

      saveToLocalStorage();
      renderSavedList();


      if (currentPresetMode === "custom") {

        barcodeValueInput.value = "";
        barcodeNameInput.value = "";

      }

    });


    /* Storage */

    function saveToLocalStorage() {

      localStorage.setItem(
        "h_barcode_db",
        JSON.stringify(savedBarcodes)
      );

    }


    /* Delete */

    function deleteBarcode(id) {

      savedBarcodes =
        savedBarcodes.filter(
          item => item.id !== id
        );

      saveToLocalStorage();
      renderSavedList();

    }


    /* Render saved barcodes */

    function renderSavedList() {

      barcodeContainer.innerHTML = "";


      if (savedBarcodes.length === 0) {

        emptyState.style.display = "block";
        return;

      }


      emptyState.style.display = "none";


      savedBarcodes.forEach(item => {

        const card =
          document.createElement("div");

        card.className =
          "barcode-tab-card";


        const titleElement =
          document.createElement("div");

        titleElement.className =
          "barcode-name";

        titleElement.textContent =
          item.name;

        card.appendChild(titleElement);


        const frame =
          document.createElement("div");

        frame.className =
          "barcode-frame";


        const svgElement =
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
          );

        svgElement.id =
          `svg_${item.id}`;


        frame.appendChild(svgElement);
        card.appendChild(frame);


        const footer =
          document.createElement("div");

        footer.className =
          "barcode-card-footer";


        const deleteBtn =
          document.createElement("button");

        deleteBtn.className =
          "delete-btn";

        deleteBtn.textContent =
          "Close Tab";


        deleteBtn.addEventListener(
          "click",
          () => deleteBarcode(item.id)
        );


        footer.appendChild(deleteBtn);
        card.appendChild(footer);
        barcodeContainer.appendChild(card);


        try {

          JsBarcode(
            svgElement,
            item.value,
            {

              format: item.format,
              background: "transparent",
              lineColor: "#1f2b21",
              width: 2,
              height: 65,
              displayValue: true,
              fontSize: 13,
              fontOptions: "bold"

            }
          );

        } catch (error) {

          console.error(
            "Barcode drawing error:",
            error
          );

          frame.innerHTML =
            '<span style="color:var(--danger); font-size:0.8rem;">Rendering Failed: Format Mismatch</span>';

        }

      });

    }


    /* Scanner */

    async function openScanner() {

      scannerOverlay.classList.add("open");
      scannerModal.classList.add("open");

      scannerStatus.textContent =
        "Requesting camera access...";

      scannerStatus.className =
        "scanner-status";


      try {

        html5QrcodeScanner =
          new Html5Qrcode(
            "scanner-viewport"
          );


        const config = {

          fps: 10,

          qrbox: {
            width: 250,
            height: 130
          }

        };


        await html5QrcodeScanner.start(

          {
            facingMode: "environment"
          },

          config,

          decodedText => {

            barcodeValueInput.value =
              decodedText;

            scannerStatus.textContent =
              "Barcode matched successfully!";

            scannerStatus.className =
              "scanner-status success";


            setTimeout(
              closeScanner,
              800
            );

          },

          () => {
            // Ignore continuous scan errors
          }

        );

      } catch (error) {

        console.error(
          "Scanner error:",
          error
        );

        scannerStatus.textContent =
          "Camera access failed. Check browser permissions.";

        scannerStatus.className =
          "scanner-status error";

      }

    }


    async function closeScanner() {

      scannerOverlay.classList.remove("open");
      scannerModal.classList.remove("open");


      if (html5QrcodeScanner) {

        try {

          const state =
            html5QrcodeScanner.getState();

          if (
            state === Html5QrcodeScannerState.SCANNING ||
            state === 2
          ) {

            await html5QrcodeScanner.stop();

          }

          await html5QrcodeScanner.clear();

        } catch (error) {

          console.log(
            "Scanner cleanup:",
            error
          );

        }


        html5QrcodeScanner = null;

      }

    }


    scanOpenBtn.addEventListener(
      "click",
      openScanner
    );

    scannerCloseBtn.addEventListener(
      "click",
      closeScanner
    );

    scannerOverlay.addEventListener(
      "click",
      closeScanner
    );

  </script>

</body>
</html>
